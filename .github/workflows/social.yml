name: Render social slides
on:
  workflow_dispatch:
    inputs:
      dir:
        description: folder under social/ (e.g. lightup-2027)
        required: true
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render PNGs
        run: |
          cd social/${{ inputs.dir }}
          for f in slide*.html; do
            google-chrome --headless=new --no-sandbox --hide-scrollbars --virtual-time-budget=8000 \
              --window-size=1080,1350 --screenshot="$PWD/${f%.html}.png" "file://$PWD/$f"
          done
          ls -la
      - name: Commit PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/${{ inputs.dir }}/*.png
          git commit -m "Render social slides: ${{ inputs.dir }}" || echo "no changes"
          git push
