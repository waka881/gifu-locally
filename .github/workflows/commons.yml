name: Commons image candidates
on:
  workflow_dispatch:
    inputs:
      only:
        description: comma-separated slugs (empty = all)
        required: false
        default: ""
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/commons_candidates.py
        env:
          ONLY: ${{ inputs.only }}
