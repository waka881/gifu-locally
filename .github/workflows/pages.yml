name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-site.txt
      - run: python site/build.py
      - name: Render Pinterest pin images
        continue-on-error: true
        run: |
          cd dist/pins
          for f in *.html; do
            google-chrome --headless=new --no-sandbox --hide-scrollbars --virtual-time-budget=8000 \
              --window-size=1000,1500 --screenshot="$PWD/${f%.html}.png" "file://$PWD/$f" 2>/dev/null
          done
          ls -la | head -40
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: |
          KEY=$(basename static/*.txt .txt)
          URLS=$(grep -o '<loc>[^<]*' dist/sitemap.xml | sed 's/<loc>//' | jq -R . | jq -s -c .)
          curl -sS -w '\nHTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"gifugourmand.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://gifugourmand.com/$KEY.txt\",\"urlList\":$URLS}"
